[General]
; Activa o desactiva la atenuacion dinamica del sol sin desinstalar el plugin
bEnabled=true

; Frecuencia de muestreo de distancia PlayerShip <-> Star en milisegundos (16.0 = ~60 Hz)
fUpdateIntervalMs=16.0

; Factor de suavizado temporal exponencial entre frames [0.01 = muy suave, 1.0 = instantaneo]
fTemporalSmoothing=0.14

; Si es true, solo se aplica en celdas espaciales (desactivado en interiores)
bEnableInSpaceOnly=true

; Registra distancia, irradiancia y oclusion en Documents\My Games\Starfield\SFSE\Logs\DynamicSunAttenuation.log
bDebugLog=false


[Attenuation]
; Modo de curva de atenuacion:
;   0 = InverseSquare (Ley fisica pura: 1 / (1 + k * ((d - d0)/d0)^2))
;   1 = Smoothstep    (Interpolacion cubica suave entre fReferenceDistance y fMaxFalloffDistance)
;   2 = Hybrid        (Inverso del cuadrado en rango cercano + cierre suave en lejania)
iAttenuationMode=2

; Distancia de referencia d0 (unidades CE2). Por debajo de este radio el sol mantiene el 100% de su brillo original
fReferenceDistance=2500.0

; Distancia maxima de atenuacion dMax (unidades CE2). Punto de transicion al minimo en modos Smoothstep/Hybrid
fMaxFalloffDistance=85000.0

; Sensibilidad de caida en la Ley del Inverso del Cuadrado (mayor valor = caida mas rapida al alejarse)
fInverseSquareFactor=1.25

; Factor maximo de oclusion lumínica global inyectada [0.0..0.98]
fMaxOcclusionAmount=0.88

; Alpha minimo del resplandor solar (Sun Glare Alpha) [0.01..1.0]
fMinSunGlareAlpha=0.12

; Escala minima del disco solar (Sun Disk Size / Billboard Scale) [0.05..1.0]
fMinSunDiskScale=0.32

; Multiplicador minimo de intensidad de la luz direccional (NiDirectionalLight) sobre la nave [0.02..1.0]
fMinDirectionalLightScale=0.18


[SpaceDetection]
; Tokens (insensibles a mayusculas) para identificar la estrella central dentro de la celda espacial
sStarEditorIDToken=Star
sSunEditorIDToken=Sun
sStarKeywordEditorID=LocTypeStar
fFallbackSystemScale=50000.0


[Hooks]
; Indice del slot virtual Update(float) en RE::PlayerCharacter::VTABLE[0] (decimal o hex, ej. 0xAD).
; En 0 usa el respaldo seguro en hilo principal via SFSE::GetTaskInterface() sin indices hardcoded.
uPlayerUpdateVfuncIdx=0

; Activa el bucle periodico por SFSE::GetTaskInterface()->AddTask() cuando uPlayerUpdateVfuncIdx=0
bUseTaskFallbackWhenUnset=true


[SkyOffsets]
; Offsets hexadecimales descubiertos mediante el volcado RTTI de RE::Sky::pad[0xEB8]
uSunPtrOffset=0x0
uSunBaseNodeOffset=0x0
uSunGlareNodeOffset=0x0
uSunDirectionalLightOffset=0x0
uSunGlareAlphaOffset=0x0
uSunOcclusionOffset=0x0


[Diagnostics]
; Vuelca en el log los primeros 64 punteros de RE::Sky::pad[0xEB8] al cargar partida (kPostLoadGame)
bDumpSkyPointersOnLoad=false

; Vuelca una sola vez al detectar la entrada en una celda espacial
bDumpSkyOnEnterSpace=true

; Codigo de tecla virtual Windows para lanzar un volcado RTTI bajo demanda (0x78 = F9, 0 = desactivado)
uDumpHotkeyVK=0x78

; Cantidad de punteros de 8 bytes a inspeccionar dentro de RE::Sky::pad[0xEB8]
uDumpPointerCount=64

; Si encuentra un objeto RTTI cuyo nombre contenga Sun/Light/Billboard/Sky, inspecciona sus 32 primeros campos hijos
bInspectSunCandidates=true
